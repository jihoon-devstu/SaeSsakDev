<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

  </style>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h3 class="card-title mb-4 text-center">이름</h3>
          
          <form id="agify-form">
            <div class="mb-3">
              <label for="name" class="form-label">이름을 입력하세요</label>
              <input type="text" class="form-control" id="name" placeholder="영문 이름을 입력하세요" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">제출</button>
          </form>

          <button type="submit" class="btn btn-primary w-100" id ="btn">요청</button>
          <div id="agify-result" class="mt-4 p-3 bg-white border rounded text-center">
            결과가 여기에 표시됩니다.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const agifyForm = document.getElementById('agify-form');
    agifyForm.addEventListener('submit', e=>{
      e.preventDefault(); // 폼 제출은 동기 처리 방식이므로 , 비동기 요청 시 항상 취소해야 합니다.
      const xhr = new XMLHttpRequest();
      xhr.open('get', `https://api.agify.io/?name=${document.getElementById('name').value}`);
      xhr.addEventListener('readystatechange',()=>{
        if(xhr.readyState === 4){
          if(xhr.status === 200){
            const result = xhr.responseText; // 응답 결과가 JSON 인 경우 "JSON 문자열" 로 받아옵니다.
            const obj = JSON.parse(result); // "JSON 문자열" -> JS 객체로 변환
            document.getElementById('agify-result').textContent = `count=${obj.count} , name=${obj.name} , age=${obj.age}`;
          }
        }
      });
      xhr.send();
    })
  </script>

  <script>
    //Promise 도입

    //1. Promise 생성 (Promise 를 생성한 뒤 반환하는 함수)
    function fetchData(url){
      return new Promise((resolve , reject)=>{
        const xhr = new XMLHttpRequest();
        xhr.open('get',url);
        xhr.addEventListener('readystatechange',()=>{
          if(xhr.readyState === 4){
            if(xhr.status ===200){
              // 약속을 이행 (fulfilled 상태)
              resolve(JSON.parse(xhr.responseText));
            }else{
              //  약속을 거부 (reject)
              reject(new Error(`요청 실패(상태코드: ${xhr.status})`));
            }
          }
        });
        xhr.send();
      });
    }

    document.getElementById('btn').addEventListener('click',e=>{
      //2. Promise 소비 (함수의 반환 값을 받아서 소비)
      fetchData('https://jsonplaceholder.typicode.com/todos/1')
        .then((obj)=>{
          console.log('API 응답 데이터', obj);
        })
        .catch((error)=>{
          console.error('에러 메세지 : ',error.message)
        });
    })




  </script>
</body>
</html>
