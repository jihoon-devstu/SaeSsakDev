<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <!-- Dom 취득 -->
  <h1 id="title" class="title head-tag">안녕하세요</h1>
  <h3 id="sub-title" class="title head-tag">Hello</h3>
  <script>

    const title = document.getElementById("title");
    console.log(title);
    const subTitle = document.getElementById("sub-title");
    console.log(subTitle);

    const titleList = document.getElementsByClassName("title");
    console.log(titleList);

    for(const element of titleList){
      console.log(element);
    }

    /*
       id 선택자 : # 다음에 id
       class 선택자 : . 다음에 class
    */
    const headTags = document.querySelectorAll(".head-tag");
    console.log(headTags);

    headTags.forEach(element => {
      console.log(element);
    });



  </script>

  <!-- Dom Attribute 취득 -->
  <div>
    <input type="text" id="id" class="inp" value="홍길동" readonly>
  </div>
  <script>
    const id = document.getElementById('id');
    
    // Attribute 취득
    console.log('type:', id.getAttribute('type'));  // "text"
    console.log('name:', id.getAttribute('name'));  // null (name 속성이 없음)
    console.log('id:', id.getAttribute('id'));  // "id"
    console.log('class:', id.getAttribute('class'));  // "inp"
    console.log('readonly:', id.getAttribute('readonly'));  // "" (readonly 속성의 값이 없음)

    // Attribute 변경
    id.setAttribute('value','김철수'); //기존 value 수정
    id.setAttribute('name' , 'username'); //새로운 Attribute 추가

    // Attribute 확인
    if(id.hasAttribute('readonly')){
      console.log('readonly 속성이 존재합니다.');
    }else{
      console.log('readonly 속성이 존재하지 않습니다.');
    }

    // Attribute 삭제
    id.removeAttribute('readonly');

    // 아래 2개는 동일한 효과를 가지고 오지만 , 1번은 메서드를 호출 2번은 속성 직접 접근이므로 , 비용을 줄이기 위해 2번으로 진행.
    id.getAttribute('class');
    id.className;


  </script>


</body>
</html>
