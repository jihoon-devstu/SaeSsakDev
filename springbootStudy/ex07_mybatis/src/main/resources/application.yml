spring:
  application:
    name: ex07_mybatis
  datasource:
    url: jdbc:mysql://localhost:3306/mybatis?useSSL=false&serverTimezone=Asia/Seoul
    username: mybatis
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always # 앱 구동 시 초기 스크립트 (schema.sql , data.sql) 항상 실행

mybatis:
  mapper-locations: classpath:mapper/*.xml
  # -mapper/user.xml , -mapper/post.xml 등 하나하나 추가하는것도 가능.
  type-aliases-package: com.example.ex07_mybatis.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
