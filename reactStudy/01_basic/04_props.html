<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <title>Document</title>
</head>
<body>
  
<div id="root1"></div>
<div id="root2"></div>
<div id="root3"></div>
<div id="root4"></div>
<div id="root5"></div>

<script type="text/babel" >

  // props 기본 개념

  // props type
  /**
   * @typeof {Object} NameCardProps
   * @property {string} name
   * @property {string} phone
  */



  const NameCard1 = (props) =>{ //props 객체에 name , phone 프로퍼티를 전달합니다.
    return (
      <>
        <div>이름 {props.name}</div>
        <div>전화 {props.phone}</div>
      </>
    );
  }  

  const NameCard2 = ({name , phone}) =>{ // 전달된 프로퍼티를 객체 구조 분해 할당으로 받습니다. (실무 표준)
    
    return (
      <>
        <div>이름 {name}</div>
        <div>전화 {phone}</div>
      </>
    );
  }  


  const userName = 'jihoon';
  const userPhone = '010-1234-5679'

  ReactDOM.createRoot(document.getElementById('root1')).render([
    <NameCard1 name = {userName} phone = {userPhone} />, // 컴포넌트로 name , phone 프로퍼티를 전달합니다.
    <NameCard2 name = {userName} phone = {userPhone} />

  ]);

  // ----- 2. props driling : 하위 컴포넌트로 프로퍼티를 계속 전달하는 것을 의미.

  // props type
  /**
   * @typeof {Object} DrillingProps
   * @property {string} data
  */

  /**
   * @type {React.FC<DrillingProps>}
  */
    const CompOne = ({data}) =>{
      return (
        <>
          <div>CompOne : {data}</div>
          <CompTwo data={data}/> {/*하위 컴포넌트로 값을 그대로 넘기는 Drilling*/}
        </>
      );
    };

    const CompTwo = ({data}) =>{
      return (
        <>
          <div>CompTwo : {data}</div>
          <CompThree data={data}/>
        </>
      );
    };

    const CompThree = ({data}) =>{
      return (
        <>
          <div>CompThree : {data}</div>

        </>
      );
    };

    // 화면에 랜더링 할 컴포넌트
    /**@type {React.FC}*/
    const App = () =>{
      //컴포넌트로 전달할 데이터
      /**@type {String}*/
      const data = 'Hello world';

      return (
        <CompOne data={data}/>

      );

    }

 ReactDOM.createRoot(document.getElementById('root2')).render(<App/>);

    // -------- 3. props children : 컴포넌트 내부 요소

    // props type
    /**
     * @typeof {Object} ChildrenProps
     * @property {string} children
    */

    /**@type {React.FC<ChildrenProps>}*/
    const GiftCard1 = (props) => {
      return(
        <p>{props.children}</p>
      );
    }

    
    /**@type {React.FC<ChildrenProps>}*/
    const GiftCard2 = ({children}) => {
      return(
        <p>{children}</p>
      );
    }

    ReactDOM.createRoot(document.getElementById('root3')).render([
      // DOM = Node
      // React = ReactNode
      <GiftCard1> 5만원 </GiftCard1>,
      <GiftCard2> <strong>10만원</strong> </GiftCard2>

    ]);


</script>

</body>
</html>
